ShortDescription: 单文件 Windows 游戏加速工具，提供帧率监测、游戏内叠加层与画面滤镜。
Description: |-
  FrameForge 是一个免安装的 Windows 游戏辅助工具，全部功能集中在一个 exe 内，
  不注入游戏进程、不安装驱动、不读取游戏内存。

  主要功能：
  - 一键加速：提升进程优先级、切换高性能电源计划、调整系统计时器，所有改动均可还原。
  - 加速排除：壁纸、直播与输入法等程序默认跳过，名单可自定义。
  - 帧率监测：通过 ETW 读取帧率与 1% Low，配合 NVML 显示显卡占用、温度、频率与功耗。
  - 游戏内叠加层：置顶半透明小窗显示帧率与硬件状态，位置可选屏幕四角或自由拖动，跟随游戏所在显示器，独占全屏时会提示改用无边框窗口。
  - 画面滤镜：通过系统颜色矩阵调整对比度、饱和度与色温，支持导入并重命名 ICC 配置文件，亮度直接调显示器硬件背光，可只在游戏时生效。
  - 性能报告：每局结束后生成本局帧率与硬件占用记录，战绩历史可回看含帧率折线图的详情。
  - 系统优化：逐项展示 VBS、GPU 硬件加速计划、MPO、全屏优化、窗口化游戏优化、电源计划、MSI 中断亲和性等设置，标注游戏推荐值，支持一键预设与配置审计。
  - 兼容性：反作弊组件（ACE、EAC、BattlEye、Vanguard 等）不会被暂停或整理内存。

  部分功能（电源计划、系统内存整理、帧率采集）需要以管理员身份运行。
