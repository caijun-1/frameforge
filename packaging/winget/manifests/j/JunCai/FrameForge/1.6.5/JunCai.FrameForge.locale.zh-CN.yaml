ShortDescription: 单文件 Windows 游戏加速工具，提供帧率监测、现代 HUD 叠加层与画面滤镜。
Description: |-
  FrameForge 是一个免安装的 Windows 游戏辅助工具，全部功能集中在一个约 7 MB 的 exe 内，
  默认不注入游戏进程、不安装驱动、不读取游戏内存。

  主要功能：
  - 一键加速：提升进程优先级、切换高性能电源计划、调整系统计时器，采用事务日志保证崩溃后也可全量还原。
  - 加速排除：壁纸、直播与输入法等程序默认跳过，名单可自定义。
  - 我的游戏：自动扫描 Steam、Epic、GOG 与常见安装目录，列出本机游戏，可一键启动或手动添加 exe。
  - 帧率监测：通过 ETW 读取帧率与 1% Low，NVIDIA 卡走 NVML、AMD 卡走 ADL，显示显卡占用、温度、频率与功耗。
  - 游戏内叠加层：支持现代毛玻璃 HUD、轻透、无底板三种底板及五套配色主题，位置可选屏幕四角或自由拖动，独占全屏下可交给 RTSS 同步配色绘制。
  - 画面滤镜：通过系统颜色矩阵与 Gamma LUT 调整对比度、饱和度与色温，支持导入并重命名 ICC 配置文件，亮度直接调显示器硬件背光。
  - 性能报告：每局结束后生成本局帧率与硬件占用记录，战绩历史可回看含帧率折线图的详情。
  - 系统优化：逐项展示 VBS、GPU 硬件加速计划、MPO、全屏优化、窗口化游戏优化、电源计划、MSI 中断亲和性等设置，支持一键预设与配置审计。
  - 兼容性：反作弊组件（ACE、EAC、BattlEye、Vanguard 等）不会被暂停或整理内存。

  部分功能（电源计划、系统内存整理、帧率采集）需要以管理员身份运行。
