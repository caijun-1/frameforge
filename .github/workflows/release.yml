name: release

# 打 tag 或手动触发：CI 从源码构建 -> SignPath 签名 -> 发布 Release
# 未配置 SignPath 变量时自动跳过签名，只发未签名产物。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4

      - name: Build with csc
        shell: pwsh
        run: ./build.ps1

      # 自检不通过就不发布:能编译但一跑就崩的包不该流到 Release。
      - name: Self test
        shell: pwsh
        run: |
          $log = Join-Path $env:TEMP "frameforge_selftest.log"
          Remove-Item $log -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath ./FrameForge.exe -ArgumentList "--selftest" -Wait -PassThru
          if (Test-Path $log) { Get-Content $log -Encoding UTF8 }
          if ($p.ExitCode -ne 0) { throw "self test failed (exit $($p.ExitCode))" }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-log
          path: ${{ runner.temp }}/frameforge_selftest.log
          if-no-files-found: warn

      - id: upload
        uses: actions/upload-artifact@v4
        with:
          name: frameforge-unsigned
          path: FrameForge.exe
          if-no-files-found: error

  sign:
    needs: build
    # 仓库变量 SIGNPATH_PROJECT_SLUG 为空时跳过，因此可以先合并代码、后补签名
    if: vars.SIGNPATH_PROJECT_SLUG != ''
    runs-on: ubuntu-latest
    steps:
      - name: Submit signing request to SignPath
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIG_SLUG }}
          # 必须是上传产物的数字 ID，不是产物名称
          github-artifact-id: ${{ needs.build.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - uses: actions/upload-artifact@v4
        with:
          name: frameforge-signed
          path: signed/
          if-no-files-found: error

  release:
    needs: [build, sign]
    if: always() && needs.build.result == 'success' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      # 签名成功就用签名产物，否则发未签名产物；两者不合并，避免同名覆盖
      - uses: actions/download-artifact@v4
        if: needs.sign.result == 'success'
        with:
          name: frameforge-signed
          path: dist

      - uses: actions/download-artifact@v4
        if: needs.sign.result != 'success'
        with:
          name: frameforge-unsigned
          path: dist

      - name: Publish release
        env:
          # 配了 RELEASE_TOKEN（自己账号的 PAT）就以本人身份发布，否则退回内置 token（显示为 github-actions[bot]）
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          sha256sum dist/FrameForge.exe | awk '{print $1}' > dist/FrameForge.exe.sha256
          gh release create "$TAG" dist/FrameForge.exe dist/FrameForge.exe.sha256 \
            --repo "${{ github.repository }}" \
            --title "FrameForge $TAG" \
            --generate-notes